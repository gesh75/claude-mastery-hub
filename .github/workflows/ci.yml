# Enforced quality gate for the guide.
#
# Security posture:
#   - `pull_request`, never `pull_request_target`: fork PRs run with a read-only
#     token and no access to secrets, so untrusted code cannot exfiltrate or push.
#   - top-level `permissions: contents: read`, the minimum this job needs.
#   - every third-party action pinned to an immutable 40-character commit SHA,
#     not a tag, so a retagged release cannot silently change what executes.
#     scripts/check-static.mjs enforces this across every workflow in the repo.
#   - `persist-credentials: false` keeps the checkout token out of .git/config.
#   - no secrets are referenced, and no untrusted event data (PR title, body,
#     branch name, author) is ever interpolated into a `run:` block. The diff
#     checker reads the event payload as JSON and passes revisions to git as
#     argv with shell: false.
#
# The gate is deliberately non-negotiable: no `continue-on-error`, no `|| true`.
# scripts/check-static.mjs re-checks these files for those patterns, so
# weakening the gate fails the gate.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A fork PR cannot escalate beyond reading the repository.
permissions:
  contents: read

# Superseded runs on the same ref are pointless; cancel them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      # fetch-depth: 0 gives the diff checker the base commit it needs; a
      # shallow clone would leave the range unresolvable.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # Verifiers must not come from the pull request they are judging. For a
      # PR, anchor them to the immutable base commit; pushes and manual runs
      # trust the commit that triggered the workflow.
      - name: Checkout trusted CI verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .trusted-ci
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install trusted verifier dependencies
        run: npm ci --prefix ".trusted-ci"

      # Checks an explicit commit range for whitespace and conflict-marker
      # errors. A bare `git diff --check` on a clean tree would inspect nothing.
      - name: Diff integrity
        run: node ".trusted-ci/scripts/check-diff.mjs"

      # Fails the build on a known high or critical advisory. This repo ships no
      # runtime dependencies, so the only exposure is the dev toolchain.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Syntax, structure, encoding artifacts, offline integrity, and a
      # meta-check that no workflow here has been made advisory or unpinned.
      - name: Static integrity checks
        run: node ".trusted-ci/scripts/check-static.mjs"

      - name: Install Playwright browser
        run: |
          ".trusted-ci/node_modules/.bin/playwright" install --with-deps chromium

      # The canonical command, so CI and local runs cannot drift.
      # CI=true turns on forbidOnly, so a stray `test.only` fails the run rather
      # than silently narrowing the suite to one test.
      - name: Run Playwright suite
        env:
          CI: "true"
        run: |
          ".trusted-ci/node_modules/.bin/playwright" test --config ".trusted-ci/playwright.config.js"

      # A green suite proves nothing if it did not actually execute the tests.
      # Runs even when the suite fails, so a failing run still reports whether
      # the suite had also quietly shrunk.
      - name: Verify test-result integrity
        if: ${{ !cancelled() }}
        run: |
          node ".trusted-ci/scripts/check-test-results.mjs" test-results/results.json ".trusted-ci/scripts/expected-tests.json"

      # Diagnostics are only useful when something broke. Uploading on success
      # would burn storage on artifacts nobody opens.
      - name: Upload Playwright diagnostics
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
